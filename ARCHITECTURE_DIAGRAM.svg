<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:500 18px Inter,Arial,sans-serif;fill:#475569}.box{rx:22;filter:url(#shadow)}.label{font:700 20px Inter,Arial,sans-serif;fill:#fff}.small{font:500 14px Inter,Arial,sans-serif;fill:#e2e8f0}.dark{fill:url(#g2)}.grad{fill:url(#g1)}.whiteLabel{font:700 18px Inter,Arial,sans-serif;fill:#0f172a}.whiteSmall{font:500 13px Inter,Arial,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="850" fill="#f8fafc"/>
  <text x="70" y="75" class="title">GoalSphere Architecture</text>
  <text x="70" y="105" class="subtitle">Enterprise Goal Setting &amp; Performance Tracking Portal</text>

  <rect x="70" y="165" width="250" height="130" class="box grad"/>
  <text x="95" y="210" class="label">Users</text>
  <text x="95" y="240" class="small">Employee</text><text x="95" y="262" class="small">Manager / L1</text><text x="95" y="284" class="small">Admin / HR</text>

  <rect x="420" y="145" width="290" height="170" class="box dark"/>
  <text x="450" y="195" class="label">Next.js 14 App</text>
  <text x="450" y="230" class="small">TypeScript + Tailwind</text><text x="450" y="252" class="small">ShadCN-style UI</text><text x="450" y="274" class="small">Responsive Dashboards</text>

  <rect x="800" y="145" width="260" height="170" class="box grad"/>
  <text x="830" y="195" class="label">Auth &amp; RBAC</text>
  <text x="830" y="230" class="small">NextAuth Credentials</text><text x="830" y="252" class="small">JWT Sessions</text><text x="830" y="274" class="small">Protected Routes</text>

  <rect x="1140" y="145" width="210" height="170" class="box dark"/>
  <text x="1170" y="195" class="label">PostgreSQL</text>
  <text x="1170" y="230" class="small">Prisma ORM</text><text x="1170" y="252" class="small">Migrations</text><text x="1170" y="274" class="small">Seed Data</text>

  <rect x="140" y="420" width="230" height="125" class="box" fill="#ffffff"/>
  <text x="165" y="465" class="whiteLabel">Goal Service</text><text x="165" y="495" class="whiteSmall">Create, submit, lock</text><text x="165" y="517" class="whiteSmall">Weightage rules</text>

  <rect x="435" y="420" width="230" height="125" class="box" fill="#ffffff"/>
  <text x="460" y="465" class="whiteLabel">Approval Service</text><text x="460" y="495" class="whiteSmall">Approve / reject</text><text x="460" y="517" class="whiteSmall">Manager comments</text>

  <rect x="730" y="420" width="230" height="125" class="box" fill="#ffffff"/>
  <text x="755" y="465" class="whiteLabel">Check-ins</text><text x="755" y="495" class="whiteSmall">Quarterly actuals</text><text x="755" y="517" class="whiteSmall">Progress scoring</text>

  <rect x="1025" y="420" width="230" height="125" class="box" fill="#ffffff"/>
  <text x="1050" y="465" class="whiteLabel">Governance</text><text x="1050" y="495" class="whiteSmall">Audit + reports</text><text x="1050" y="517" class="whiteSmall">Escalations</text>

  <rect x="255" y="660" width="250" height="100" class="box grad"/>
  <text x="285" y="705" class="label">Reports</text><text x="285" y="735" class="small">CSV / Excel Export</text>

  <rect x="575" y="660" width="250" height="100" class="box dark"/>
  <text x="605" y="705" class="label">Notifications</text><text x="605" y="735" class="small">In-app + Email-ready</text>

  <rect x="895" y="660" width="250" height="100" class="box grad"/>
  <text x="925" y="705" class="label">Integrations</text><text x="925" y="735" class="small">Entra ID / Teams-ready</text>

  <path class="line" d="M320 230 C360 230 380 230 420 230"/>
  <path class="line" d="M710 230 C750 230 760 230 800 230"/>
  <path class="line" d="M1060 230 C1100 230 1100 230 1140 230"/>
  <path class="line" d="M565 315 C565 360 255 370 255 420"/>
  <path class="line" d="M565 315 C565 360 550 370 550 420"/>
  <path class="line" d="M565 315 C565 360 845 370 845 420"/>
  <path class="line" d="M930 315 C930 360 1140 370 1140 420"/>
  <path class="line" d="M1140 545 C1140 600 1020 610 1020 660"/>
  <path class="line" d="M845 545 C845 600 700 610 700 660"/>
  <path class="line" d="M255 545 C255 600 380 610 380 660"/>
</svg>
